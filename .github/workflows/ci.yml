name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # The framework-free core is what CI verifies; the React Native UI layer
      # needs the Expo toolchain and a device, so it is not built here.
      - run: npx tsc -p tsconfig.check.json --noEmit
      - run: npx vitest run
